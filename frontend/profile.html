<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Profile - AgriGani</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-flower1 me-2"></i>
                <span class="brand-text">AgriGani</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="diagnose.html">Diagnose</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
                    <li class="nav-item"><a class="nav-link" href="diseases.html">Diseases</a></li>
                    <li class="nav-item"><a class="nav-link" href="vendors.html">Vendors</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title">Farmer Profile</h1>
            <p class="page-subtitle">Manage farmer records linked to your account</p>
        </div>
    </section>

    <section class="section-padding">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="feature-card">
                        <h3 class="feature-title mb-3">Account</h3>
                        <div id="accountSummary" class="text-muted">Loading account...</div>
                    </div>

                    <form id="farmerForm" class="feature-card mt-4">
                        <h3 class="feature-title mb-3" id="formTitle">Add Farmer</h3>
                        <input type="hidden" id="farmerId">
                        <div class="mb-3">
                            <label for="farmerName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="farmerName" required>
                        </div>
                        <div class="mb-3">
                            <label for="farmerPhone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="farmerPhone" required>
                        </div>
                        <div class="mb-3">
                            <label for="farmerEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="farmerEmail">
                        </div>
                        <div class="mb-3">
                            <label for="farmerLocation" class="form-label">Location</label>
                            <input type="text" class="form-control" id="farmerLocation" required>
                        </div>
                        <div class="mb-3">
                            <label for="farmerRegion" class="form-label">Region</label>
                            <select class="form-select" id="farmerRegion" required>
                                <option value="">Select region</option>
                                <option value="NG-FC">Abuja (FCT)</option>
                                <option value="NG-LA">Lagos</option>
                                <option value="NG-KD">Kaduna</option>
                                <option value="NG-KN">Kano</option>
                                <option value="NG-NI">Niger</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="farmerGender" class="form-label">Gender</label>
                                <select class="form-select" id="farmerGender">
                                    <option value="">Select</option>
                                    <option value="M">Male</option>
                                    <option value="F">Female</option>
                                    <option value="O">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="farmerFarmSize" class="form-label">Farm Size</label>
                                <input type="number" class="form-control" id="farmerFarmSize" step="0.1" min="0">
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">Save</button>
                            <button type="button" class="btn btn-outline-secondary" id="resetFormButton">Reset</button>
                        </div>
                    </form>
                </div>

                <div class="col-lg-8">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="section-title mb-0">Farmers</h2>
                        <a href="diagnose.html" class="btn btn-outline-primary">
                            <i class="bi bi-camera-fill me-2"></i>Diagnose
                        </a>
                    </div>
                    <div id="farmersContainer" class="row g-4"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
