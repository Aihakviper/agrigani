<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnosis History - AgriGani</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-flower1 me-2"></i>
                <span class="brand-text">AgriGani</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="diagnose.html">Diagnose</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="history.html">History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="diseases.html">Diseases</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="vendors.html">Vendors</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title">Diagnosis History</h1>
            <p class="page-subtitle">View and manage your past diagnoses</p>
        </div>
    </section>

    <!-- Filters -->
    <section class="section-padding bg-light">
        <div class="container">
            <div class="card filter-card">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="filterFarmer" class="form-label">Farmer</label>
                            <select class="form-select" id="filterFarmer">
                                <option value="">All Farmers</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="filterDisease" class="form-label">Disease</label>
                            <select class="form-select" id="filterDisease">
                                <option value="">All Diseases</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="filterRegion" class="form-label">Region</label>
                            <select class="form-select" id="filterRegion">
                                <option value="">All Regions</option>
                                <option value="NG-FC">Abuja (FCT)</option>
                                <option value="NG-LA">Lagos</option>
                                <option value="NG-KD">Kaduna</option>
                                <option value="NG-KN">Kano</option>
                                <option value="NG-NI">Niger</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- History List -->
    <section class="section-padding">
        <div class="container">
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading diagnosis history...</p>
            </div>

            <div id="historyContainer" style="display: none;">
                <!-- History items will be inserted here -->
            </div>

            <div id="emptyState" class="text-center py-5" style="display: none;">
                <i class="bi bi-inbox empty-icon"></i>
                <h3 class="mt-3">No Diagnoses Found</h3>
                <p class="text-muted">Start by creating your first diagnosis</p>
                <a href="diagnose.html" class="btn btn-primary mt-3">
                    <i class="bi bi-camera-fill me-2"></i>New Diagnosis
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="text-center">
                <p class="footer-copyright mb-0">&copy; 2026 AgriGani by Aihak Agrotech. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
