<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Directory - AgriGani</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-flower1 me-2"></i>
                <span class="brand-text">AgriGani</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="diagnose.html">Diagnose</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
                    <li class="nav-item"><a class="nav-link" href="diseases.html">Diseases</a></li>
                    <li class="nav-item"><a class="nav-link active" href="vendors.html">Vendors</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title">Vendor Directory</h1>
            <p class="page-subtitle">Find trusted agricultural vendors near you</p>
        </div>
    </section>

    <!-- Filter Section -->
    <section class="section-padding bg-light">
        <div class="container">
            <div class="row g-3">
                <div class="col-md-6">
                    <select class="form-select" id="regionFilter">
                        <option value="">All Regions</option>
                        <option value="NG-FC">Abuja (FCT)</option>
                        <option value="NG-LA">Lagos</option>
                        <option value="NG-KD">Kaduna</option>
                        <option value="NG-KN">Kano</option>
                        <option value="NG-NI">Niger</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <select class="form-select" id="typeFilter">
                        <option value="">All Types</option>
                        <option value="AGRO_DEALER">Agricultural Dealer</option>
                        <option value="VET_CLINIC">Veterinary Clinic</option>
                        <option value="PHARMACY">Agricultural Pharmacy</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Vendors List -->
    <section class="section-padding">
        <div class="container">
            <div id="vendorsContainer" class="row g-4">
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="text-center">
                <p class="footer-copyright mb-0">&copy; 2026 AgriGani by Aihak Agrotech. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        let allVendors = [];
        
        async function loadVendors() {
            try {
                const data = await Utils.apiRequest(API_CONFIG.getEndpoint('VENDORS'));
                allVendors = data.results || data;
                renderVendors();
            } catch (error) {
                document.getElementById('vendorsContainer').innerHTML = 
                    '<div class="col-12"><div class="alert alert-danger">Error loading vendors</div></div>';
            }
        }
        
        function renderVendors() {
            const container = document.getElementById('vendorsContainer');
            const regionFilter = document.getElementById('regionFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            
            const filtered = allVendors.filter(v => {
                if (regionFilter && v.region_code !== regionFilter) return false;
                if (typeFilter && v.vendor_type !== typeFilter) return false;
                return true;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-12"><div class="alert alert-info">No vendors found</div></div>';
                return;
            }
            
            container.innerHTML = filtered.map(vendor => `
                <div class="col-md-6 col-lg-4">
                    <div class="feature-card h-100">
                        <h3 class="feature-title">${vendor.name}</h3>
                        <div class="mb-3">
                            <span class="badge bg-primary">${Utils.formatVendorType(vendor.vendor_type)}</span>
                            ${vendor.is_verified ? '<span class="badge bg-success ms-2"><i class="bi bi-patch-check-fill"></i> Verified</span>' : ''}
                        </div>
                        <p class="mb-2"><i class="bi bi-geo-alt-fill text-success me-2"></i>${vendor.location}</p>
                        <p class="mb-2"><i class="bi bi-telephone-fill text-success me-2"></i><a href="tel:${vendor.phone_number}">${vendor.phone_number}</a></p>
                        ${vendor.email ? `<p class="mb-2"><i class="bi bi-envelope-fill text-success me-2"></i><a href="mailto:${vendor.email}">${vendor.email}</a></p>` : ''}
                        ${vendor.rating ? `<p class="mb-0"><i class="bi bi-star-fill text-warning me-2"></i>${Number(vendor.rating).toFixed(1)}</p>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadVendors();
            document.getElementById('regionFilter').addEventListener('change', renderVendors);
            document.getElementById('typeFilter').addEventListener('change', renderVendors);
        });
    </script>
</body>
</html>
